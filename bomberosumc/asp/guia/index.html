<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Versiones | Nivel Empresarial</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="neuralCanvas"></canvas>

    <header class="main-header glass">
        <div class="header-content container">
            <img src="https://i.ibb.co/gZ1VT076/cbm.png" alt="Logo de la Institución" class="logo">
            <h1>VERSIONES - ASP</h1>
        </div>
    </header>

    <main class="container">
        <section id="hero-widget" class="hero-card glass" tabindex="0" role="button" aria-label="Descargar última actualización">
            <div class="hero-content">
                <div class="badge">Última actualización</div>
                <h2 id="hero-title">Sincronizando...</h2>
                <p id="hero-desc">Conectando con el servidor seguro...</p>
                <div id="hero-meta" class="meta"></div>
            </div>
            <div class="hero-action">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </div>
        </section>

        <section class="version-list-container">
            <h3>Historial de Versiones</h3>
            <div id="version-grid" class="version-grid">
                </div>
        </section>
    </main>

    <div id="loader-modal" class="modal-overlay">
        <div class="modal-content glass">
            <h3>Preparando descarga segura</h3>
            <p id="modal-status">Verificando integridad del archivo...</p>
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="progress-text" class="progress-text">0%</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
