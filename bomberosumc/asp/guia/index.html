<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Versiones | Nivel Empresarial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <canvas id="neuralCanvas" aria-hidden="true"></canvas>

    <header class="main-header shadow-dark">
        <div class="header-content container">
            <div class="logo-placeholder">
                <i data-lucide="shield-check" class="icon-accent"></i>
            </div>
            <h1>VERSIONES <span class="text-blue">ASP</span></h1>
        </div>
    </header>

    <main class="container">
        <section id="hero-widget" class="hero-card shadow-dark" tabindex="0" role="button" aria-label="Descargar última actualización">
            <div class="hero-content">
                <div class="badge">
                    <i data-lucide="zap" class="badge-icon"></i> Última actualización
                </div>
                <h2 id="hero-title">Sincronizando...</h2>
                <p id="hero-desc">Conectando con el servidor seguro...</p>
                <div id="hero-meta" class="meta">
                    <i data-lucide="calendar" class="meta-icon"></i> <span id="hero-date"></span>
                </div>
            </div>
            <div class="hero-action">
                <i data-lucide="download-cloud" class="download-icon"></i>
            </div>
        </section>

        <section class="version-list-container">
            <h3>Historial de Versiones</h3>
            <div id="version-grid" class="version-grid">
                </div>
        </section>
    </main>

    <div id="loader-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content shadow-dark">
            <div class="modal-header">
                <i data-lucide="server" class="modal-icon"></i>
                <h3 id="modal-title">Preparando descarga segura</h3>
            </div>
            <p id="modal-status">Estableciendo conexión...</p>
            <div class="progress-bar-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="progress-text" class="progress-text">0%</span>
            
            <button id="modal-close-btn" class="btn-cancel hidden">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
